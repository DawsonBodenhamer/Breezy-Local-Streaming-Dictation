[server]
url = "http://127.0.0.1:8000"
model = ""
language = "en"
timeout = 30
prompt = "If you want stronger results, start with one clear idea and make it easy to recognize. By the way you do not need to explain everything in the thumbnail because the title can provide context. I’ve tested many different approaches so I know simple designs usually work best."
temperature = 0.0
hotwords = "period, comma, colon, semicolon, question mark, exclamation mark, new line, new paragraph"

[hotkey]
binding = "ctrl+alt+shift+f24"
mode = "toggle"

[vad]
threshold = 0.45
silence_ms = 750
min_speech_ms = 75
max_speech_s = 90.0
pre_speech_ms = 750

[audio]
sample_rate = 16000
channels = 1
device = -1

[engine]
type = "local"
compute_type = "float16"
device = "cuda"

[websocket]
reconnect_attempts = 3
reconnect_delay = 1.0
